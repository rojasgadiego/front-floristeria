<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Floristería Colibrí" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Floristería Colibrí</title>

  <!-- Fondo sólido en el color de marca. Va relleno y no calado porque a
       16px un contorno se pierde, y así el ícono se lee igual sobre una
       barra de pestañas clara u oscura sin depender de prefers-color-scheme.
       Para cambiar el color de marca, es este único valor. -->
  <rect width="64" height="64" rx="14" fill="#E3568C" />

  <!-- El colibrí, centrado dentro del cuadro.
       El traslado corrige el centro real de los dos paths (31.5, 30.5)
       contra el centro del lienzo (32, 32). -->
  <g transform="translate(0.5 1.5)" fill="#ffffff">
    <path d="M44 15 C50 15 53 19 52 23 C50 32 40 40 26 43 L8 47 L15 37 C22 29 30 17 44 15 Z" />
    <path d="M30 27 C36 18 46 14 55 16 C50 25 41 31 32 32 Z" opacity="0.55" />
    <!-- El ojo va del color del fondo: sobre el pájaro blanco, un punto
         blanco no existiría. -->
    <circle cx="46" cy="21" r="1.7" fill="#E3568C" />
  </g>
</svg>
