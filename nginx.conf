server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html siempre se revalida: es el que dice qué bundle cargar, y si
  # el navegador lo guarda, "Actualizar" recarga la versión vieja. Los js y
  # css llevan hash en el nombre y se pueden cachear para siempre.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* ^/(js|css)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
